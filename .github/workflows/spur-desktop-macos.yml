name: Spur Desktop macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/spur-desktop-macos-*'
    paths:
      - 'V2/desktop/**'
      - '.github/workflows/spur-desktop-macos.yml'

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: V2/desktop/spur-desktop
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: V2/desktop/spur-desktop/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11.9'
          architecture: ${{ matrix.arch }}
      - name: Build and verify native app
        run: bash build-macos.sh --arch '${{ matrix.arch }}' --python "$pythonLocation/bin/python3" --smoke-test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify DMG filesystem
        run: |
          version="$(node -p "require('./package.json').version")"
          hdiutil verify "release/Spur-Desktop-${version}-macOS-${{ matrix.arch }}.dmg"
      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Spur-Desktop-macOS-${{ matrix.arch }}
          path: V2/desktop/spur-desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Spur-Desktop-macOS-${{ matrix.arch }}-diagnostics
          path: V2/desktop/spur-desktop/test-output/*
          if-no-files-found: ignore
          retention-days: 7
