[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spur-ring-agent"
version = "0.1.0"
description = "Local-first YouTube intelligence agent backend"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "defusedxml>=0.7,<1", "yt-dlp>=2026.10.26"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["spur*"]

[tool.setuptools.package-data]
spur = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
